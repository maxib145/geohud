<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEO Lernskripte</title>
<meta name="theme-color" content="#0F1117">
<meta name="description" content="Interaktive Lernskripte und Klausur-Cheatsheets – Vermessung und Geoinformatik (THWS)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEO Skripte">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hlDark">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hlLight" disabled>
<script>try{const t=localStorage.getItem("geo.theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#0F1117; --bg2:#13161E; --panel:#161A23; --hover:#1A1F2A; --line:#1E222D; --line2:#2A3040;
  --txt:#E6E8EE; --txt2:#B6BDCB; --mut:#8790A2; --dim:#5D6577;
  --acc:#7AA2F7; --acc-bg:rgba(122,162,247,.10);
  --def:#7AA2F7; --def-bg:rgba(122,162,247,.08);
  --trap:#F7768E; --trap-bg:rgba(247,118,142,.08);
  --merke:#9ECE6A; --merke-bg:rgba(158,206,106,.08);
  --ex:#BB9AF7; --ex-bg:rgba(187,154,247,.08);
  --info:#E0AF68; --info-bg:rgba(224,175,104,.08);
  --ok:#9ECE6A; --bad:#F7768E;
  --code-bg:#0B0D12;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --side:272px; --toc:220px; --content:740px; --r:10px;
}
[data-theme="light"]{
  --bg:#FFFFFF; --bg2:#F8F9FB; --panel:#FFFFFF; --hover:#F2F4F7; --line:#E6E8EC; --line2:#D5D9E0;
  --txt:#14161C; --txt2:#3A4150; --mut:#6B7280; --dim:#9AA1AD;
  --acc:#2F5BD3; --acc-bg:rgba(47,91,211,.07);
  --def:#2F5BD3; --def-bg:rgba(47,91,211,.06);
  --trap:#C7354F; --trap-bg:rgba(199,53,79,.06);
  --merke:#3C8A2E; --merke-bg:rgba(60,138,46,.07);
  --ex:#7B4FD0; --ex-bg:rgba(123,79,208,.06);
  --info:#A86A10; --info-bg:rgba(168,106,16,.07);
  --ok:#2E8B3E; --bad:#C7354F; --code-bg:#F6F8FA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit;color:inherit;cursor:pointer}
::selection{background:var(--acc-bg)}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--bg2);padding:18px 12px 40px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:600;font-size:15px;cursor:pointer}
.brand img{width:22px;height:22px;border-radius:6px}
.grp{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--txt2);font-size:14px;line-height:1.35}
.nav a:hover{background:var(--hover);text-decoration:none}
.nav a.on{background:var(--acc-bg);color:var(--txt)}
.nav .pg{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--line2);flex:none}
.nav .dot.full{background:var(--acc)} .nav .dot.legacy{background:transparent;border:1px solid var(--line2)}
.side-foot{margin-top:24px;padding:12px 10px;border-top:1px solid var(--line);display:flex;gap:8px}
.ghost{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--mut)}
.ghost:hover{border-color:var(--line2);color:var(--txt)}
.main{min-width:0}
.scrim{display:none}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;padding:10px 28px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:7px;width:36px;height:34px;font-size:16px}
.crumb{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--txt);font-weight:600}
.tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:3px;margin-left:auto;flex:none}
.tabs button{border:none;background:none;padding:6px 12px;border-radius:6px;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--panel);color:var(--txt);box-shadow:0 0 0 1px var(--line2)}
.progress{height:2px}
.progress i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.body{display:grid;grid-template-columns:minmax(0,1fr) var(--toc);gap:40px;max-width:calc(var(--content) + var(--toc) + 120px);margin:0 auto;padding:36px 28px 120px}
.doc{max-width:var(--content);min-width:0}
.toc{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 100px);overflow-y:auto;font-size:13px}
.toc .t{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.toc a{display:block;padding:4px 0 4px 12px;color:var(--mut);border-left:1px solid var(--line);line-height:1.4}
.toc a.sub{padding-left:24px;font-size:12.5px}
.toc a:hover{color:var(--txt);text-decoration:none}
.toc a.on{color:var(--txt);border-left-color:var(--acc)}
.doc h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;margin:0 0 8px;font-weight:700}
.doc .lead{color:var(--mut);font-size:15px;margin:0 0 28px}
.doc h2{font-size:22px;letter-spacing:-.01em;margin:56px 0 12px;padding-top:8px;font-weight:650;scroll-margin-top:80px}
.doc h3{font-size:17px;margin:32px 0 8px;font-weight:600;scroll-margin-top:80px}
.doc h4{font-size:15px;margin:22px 0 6px;font-weight:600;color:var(--txt2)}
.doc p{margin:10px 0;color:var(--txt2)}
.doc p b,.doc li b,.doc td b{color:var(--txt);font-weight:600}
.doc ul,.doc ol{padding-left:22px;color:var(--txt2);margin:10px 0}
.doc li{margin:5px 0}
.chnum{display:inline-block;font-size:12px;font-weight:600;color:var(--acc);letter-spacing:.04em;margin-bottom:4px}
.math{overflow-x:auto;overflow-y:hidden;margin:14px 0;padding:4px 0}
.math .katex-display{margin:6px 0}
code{font-family:var(--mono);font-size:.86em;background:var(--hover);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
pre{margin:14px 0;border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;background:var(--code-bg)}
pre code{display:block;padding:14px 16px!important;border:none;background:none!important;font-size:13.5px;line-height:1.6}
.tablewrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
th{font-weight:600;font-size:12.5px;color:var(--mut);background:var(--bg2)}
td{color:var(--txt2)}
hr{border:none;border-top:1px solid var(--line);margin:40px 0}
figure{margin:18px 0;text-align:center}
figure svg{max-width:100%;height:auto}
figcaption{font-size:13px;color:var(--mut);margin-top:6px}
.callout{border:1px solid var(--line);border-left:3px solid var(--c);background:var(--cb);border-radius:8px;padding:12px 16px;margin:16px 0}
.callout .ct{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.callout p{margin:6px 0}
.callout.def{--c:var(--def);--cb:var(--def-bg)} .callout.trap{--c:var(--trap);--cb:var(--trap-bg)}
.callout.merke{--c:var(--merke);--cb:var(--merke-bg)} .callout.ex{--c:var(--ex);--cb:var(--ex-bg)} .callout.info{--c:var(--info);--cb:var(--info-bg)}
.steps{border:1px solid var(--line);border-radius:var(--r);margin:18px 0;background:var(--panel)}
.steps .sh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.steps .sh .lbl{font-size:12px;font-weight:600;color:var(--ex);letter-spacing:.05em;text-transform:uppercase}
.steps .sh .cnt{margin-left:auto;font-size:12px;color:var(--dim)}
.steps .task{padding:12px 16px 4px}
.steps .task p{margin:4px 0}
.steps ol.st{list-style:none;margin:0;padding:4px 16px 8px}
.steps ol.st li{display:none;border-top:1px dashed var(--line);padding:10px 0;margin:0}
.steps ol.st li.show{display:block;animation:fade .25s}
.steps ol.st li .n{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:2px}
.steps .sf{padding:10px 16px 14px;display:flex;gap:8px;flex-wrap:wrap}
/* Tactile controls: solid fill + strong hairline at rest, accent tint on hover, 1px press. No shadows (Hairline Rule). */
.btn,.opt,.chip,.cl,.card,.ghost{transition:background-color .15s cubic-bezier(.2,.8,.2,1),border-color .15s cubic-bezier(.2,.8,.2,1),color .15s,transform .08s}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.cl:focus-visible,.card:focus-visible,.ghost:focus-visible,.tabs button:focus-visible,.gap input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{border:1px solid var(--line2);background:var(--hover);border-radius:7px;padding:8px 14px;font-size:13.5px;font-weight:500;color:var(--txt)}
.btn:hover:not(:disabled){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--hover))}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.pri:hover:not(:disabled){background:color-mix(in srgb,var(--acc) 86%,var(--txt));border-color:color-mix(in srgb,var(--acc) 86%,var(--txt))}
[data-theme="dark"] .btn.pri{color:#0F1117}
.btn:disabled{opacity:.45;cursor:default}
.quiz{border:1px solid var(--line);border-radius:var(--r);margin:24px 0;background:var(--panel)}
.quiz .qh{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--merke)}
.q{padding:14px 16px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.q .qq{font-weight:500;margin-bottom:10px;color:var(--txt)}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line2);background:var(--hover);border-radius:8px;padding:11px 14px;font-size:14.5px;color:var(--txt)}
.opt:hover:not(:disabled){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--hover))}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt.ok{border-color:var(--ok);background:var(--merke-bg);color:var(--txt)} .opt.bad{border-color:var(--bad);background:var(--trap-bg);color:var(--txt2)}
.opt:disabled{cursor:default}
.opts:has(.opt.ok) .opt:not(.ok):not(.bad){opacity:.6}
.cl{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:13px;border:1px solid var(--line2);background:var(--code-bg);border-radius:6px;padding:8px 10px;margin:4px 0;white-space:pre;overflow-x:auto;color:var(--txt2)}
.cl:hover:not(:disabled){border-color:var(--acc);color:var(--txt)}
.cl .ln{color:var(--dim);margin-right:12px}
.cl.ok{border-color:var(--ok);background:var(--merke-bg)} .cl.bad{border-color:var(--bad);background:var(--trap-bg)}
.chip{text-align:left;border:1px dashed var(--line2);background:var(--hover);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--txt)}
.chip:hover:not(:disabled){border-color:var(--acc)}
.chip:active:not(:disabled){transform:translateY(1px)}
.chip.sel{border-style:solid;border-color:var(--acc);background:var(--acc-bg)}
.chip.mono{font-family:var(--mono);font-size:13px;white-space:pre}
.chip .k{font-size:11px;color:var(--acc);font-weight:600;margin-right:8px}
.ord{display:grid;gap:6px}
.gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gap input{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:7px 10px;color:var(--txt);font-family:var(--mono);font-size:14px;width:150px}
.fb{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--txt2)}
.fb.show{display:block;animation:fade .2s}
.fb.ok{background:var(--merke-bg);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.bad{background:var(--trap-bg);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.fb b{color:var(--txt)}
.chend{display:flex;align-items:center;gap:10px;margin:28px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
.chend .btn{margin-left:auto}
.chend.done .btn{border-color:var(--ok);color:var(--ok)}
.src{font-size:12.5px;color:var(--dim);margin-top:30px;padding-left:0!important;list-style:none}
.src li{margin:2px 0}
.home h1{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:14px 0 30px}
.card{display:block;border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px;background:var(--hover);color:var(--txt)}
.card:hover{border-color:var(--acc);text-decoration:none;background:color-mix(in srgb,var(--acc) 8%,var(--hover))}
.card:active{transform:translateY(1px)}
.card .ct{font-weight:600;font-size:15px}
.card .cm{font-size:13px;color:var(--mut);margin-top:2px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--acc)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--mut);margin-left:6px;vertical-align:1px;font-weight:500}
.badge.full{border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--acc)}
.cs-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.cs-head .btn{margin-left:auto}
.cs{columns:2 340px;column-gap:24px}
.cs .sec{break-inside:avoid;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 16px;background:var(--panel)}
.cs .sec h3{margin:0 0 8px;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.cs .sec p,.cs .sec li{font-size:13.5px}
.cs .math{margin:6px 0}
.cs table{font-size:12.5px} .cs th,.cs td{padding:5px 8px}
.cs .tablewrap{margin:8px 0}
.cs .callout{padding:8px 12px;margin:8px 0}
.vars{font-size:12.5px;color:var(--mut);margin:0 0 8px}
.vars>span{display:block;margin:2px 0}
.cs .math .katex-display{font-size:.92em;margin:.3em 0}
.recipe ol{margin:6px 0;padding-left:20px}
.legacy-note{border:1px dashed var(--line2);border-radius:var(--r);padding:12px 16px;color:var(--mut);font-size:14px;margin-bottom:20px}
.empty{color:var(--mut);padding:40px 0}
@keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
@media (max-width:1180px){ .body{grid-template-columns:minmax(0,1fr)} .toc{display:none} }
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:50;width:min(300px,86vw);transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .side.open{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  .scrim.show{display:block}
  .menu-btn{display:block}
  .topbar-in{padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));flex-wrap:wrap}
  .crumb{flex:1;min-width:0}
  .tabs{order:3;width:100%;margin-left:0}
  .tabs button{flex:1}
  .body{padding:22px 16px 100px}
  .doc h1{font-size:25px}
  .doc h2{font-size:20px;margin-top:44px}
  .cs{columns:1}
}
@media print{
  @page{size:A4;margin:10mm 9mm}
  :root,[data-theme="dark"],[data-theme="light"]{--bg:#fff;--bg2:#f6f7f9;--panel:#fff;--hover:#fff;--line:#d5d9e0;--line2:#c3c8d0;--txt:#000;--txt2:#111;--mut:#444;--dim:#666;--acc:#1d4fc4;--code-bg:#f5f6f8;--def:#1d4fc4;--trap:#b4233f;--merke:#2c7a22;--ex:#6a3fc0;--info:#94600c}
  html,body{background:#fff;font-size:10px;line-height:1.35}
  .side,.topbar,.toc,.no-print,.chend,.quiz,.steps .sf,.scrim{display:none!important}
  .app{display:block} .body{display:block;padding:0;max-width:none}
  .doc{max-width:none}
  .steps ol.st li{display:block!important}
  .cs{columns:auto;display:grid;grid-template-columns:1fr 1fr;gap:0 6mm;align-items:start}
  .cs .sec{padding:4px 6px;margin:0 0 2.5mm;border-radius:3px}
  .cs .sec h3{font-size:9px;margin-bottom:2px}
  .cs .sec p,.cs .sec li,.cs td,.cs th,.cs .vars{font-size:8.2px;margin:1px 0}
  .cs .callout{padding:3px 6px;margin:3px 0}
  .cs .callout .ct{font-size:7.5px;margin:0}
  .cs .math{margin:2px 0;padding:0}
  .doc h1{font-size:14px;margin:0} .doc .lead{font-size:8.5px;margin:0 0 2mm}
  pre code{font-size:7.8px!important;padding:3px 5px!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim" onclick="toggleMenu(false)"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-in">
        <button class="menu-btn" onclick="toggleMenu(true)" aria-label="Menü">☰</button>
        <div class="crumb" id="crumb"></div>
        <div class="tabs" id="tabs" style="display:none">
          <button data-v="skript" onclick="setView('skript')">Interaktives Lernskript</button>
          <button data-v="cheatsheet" onclick="setView('cheatsheet')">Klausur-Cheatsheet</button>
        </div>
      </div>
      <div class="progress"><i id="prog"></i></div>
    </header>
    <div class="body">
      <article class="doc" id="doc"></article>
      <nav class="toc" id="toc"></nav>
    </div>
  </div>
</div>
<script src="subjects.js"></script>
<script src="studyData.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<script>
/* GEO Lernskripte – Renderer
   Inhalte: content/<fach>.js -> window.CONTENT[<id>] = { title, lead, chapters:[{id,title,intro,blocks,sources}], cheatsheet:{lead,sections:[{title,blocks}]}, sources }
   Fächer ohne neues Skript: Fallback aus studyData.js (alte Missionen) als vorläufiges Skript. */
window.CONTENT = window.CONTENT || {};
const SUBJ = window.SUBJECTS;
const KEY = "geo.read.v2";
let READ = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } })();
const saveRead = () => { try{ localStorage.setItem(KEY, JSON.stringify(READ)); }catch(e){} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem("geo.theme", t); }catch(e){}
  $("#hlDark").disabled = t!=="dark"; $("#hlLight").disabled = t!=="light";
  document.querySelector('meta[name="theme-color"]').content = t==="dark" ? "#0F1117" : "#FFFFFF";
  const b = $("#themeBtn"); if(b) b.textContent = t==="dark" ? "☀︎ Hell" : "☾ Dunkel";
}
function toggleTheme(){ setTheme(document.documentElement.dataset.theme==="dark" ? "light" : "dark"); }
function toggleMenu(o){ $("#side").classList.toggle("open", o); $("#scrim").classList.toggle("show", o); }

const loading = {};
function loadContent(id){
  const s = SUBJ.list.find(x=>x.id===id);
  if(CONTENT[id]) return Promise.resolve(CONTENT[id]);
  if(!s || !s.file) return Promise.resolve(legacy(id));
  if(loading[id]) return loading[id];
  return loading[id] = new Promise(res=>{
    const el = document.createElement("script"); el.src = s.file + "?v=" + (SUBJ.version||"");
    el.onload = ()=>res(CONTENT[id] || legacy(id)); el.onerror = ()=>res(legacy(id));
    document.head.appendChild(el);
  });
}
function legacy(id){
  const s = SUBJ.list.find(x=>x.id===id); const D = window.STUDY_DATA; if(!D) return null;
  let mod = null; D.semesters.forEach(sm=>sm.modules.forEach(m=>{ if(m.id===(s.legacy||id)) mod=m; }));
  if(!mod || !mod.missions.length) return null;
  return { legacy:true, title:s.title,
    lead:"Vorläufiges Skript aus den bisherigen Lerneinheiten. Das vollständige Skript im neuen Aufbau folgt.",
    chapters: mod.missions.map(x=>({ id:x.id, title:x.title,
      blocks:[ {callout:"merke", title:"Worum geht's?", body:x.tldr}, ...x.core.map(convBlock),
        ...(x.tips||[]).map(t=>({callout:"info", title:t.title, body:t.body})),
        ...(x.traps||[]).map(t=>({callout:"trap", title:t.title.replace(/^Falle:\s*/,""), body:t.body})),
        ...(x.checks&&x.checks.length?[{quiz:x.checks}]:[]) ],
      sources:x.sources })),
    cheatsheet:null };
}
function convBlock(b){ if(b.h) return {h3:b.h}; if(b.note) return {callout:"merke", body:b.note}; return b; }

let QID = 0;
function blocks(arr, ctx){ return (arr||[]).map(b=>block(b, ctx)).join(""); }
function block(b, ctx){
  if(b.h2) return `<h3 id="${ctx.slug(b.h2)}">${b.h2}</h3>`;
  if(b.h3) return `<h3 id="${ctx.slug(b.h3)}">${b.h3}</h3>`;
  if(b.h4) return `<h4>${b.h4}</h4>`;
  if(b.p) return `<p>${b.p}</p>`;
  if(b.math) return `<div class="math">$$${b.math}$$</div>`;
  if(b.list) return `<ul>${b.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(b.olist) return `<ol>${b.olist.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  if(b.code!==undefined) return `<pre><code class="language-${b.lang||"plaintext"}">${esc(b.code)}</code></pre>`;
  if(b.table) return `<div class="tablewrap"><table>${b.table.head?`<thead><tr>${b.table.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead>`:""}<tbody>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(b.callout){ const names={def:"Definition",trap:"Klausur-Falle",merke:"Merksatz",ex:"Beispiel",info:"Hinweis"};
    return `<div class="callout ${b.callout}"><div class="ct">${b.title?(names[b.callout]+" · "+b.title):names[b.callout]}</div>${/^\s*</.test(b.body)?b.body:`<p>${b.body}</p>`}</div>`; }
  if(b.steps) return stepsBox(b.steps);
  if(b.quiz) return quizBox(b.quiz, b.title);
  if(b.figure) return `<figure>${b.figure}${b.caption?`<figcaption>${b.caption}</figcaption>`:""}</figure>`;
  if(b.hr) return `<hr>`;
  if(b.html) return b.html;
  if(b.formula) return `<div class="math">$$${b.formula}$$</div>${b.vars?`<div class="vars">${b.vars.map(v=>`<span>${v}</span>`).join("")}</div>`:""}`;
  if(b.recipe) return `<div class="recipe"><p><b>${b.recipe.title}</b></p><ol>${b.recipe.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>`;
  return "";
}
function stepsBox(s){
  const id = "st"+(++QID);
  return `<div class="steps" id="${id}" data-i="0" data-n="${s.steps.length}">
    <div class="sh"><span class="lbl">Rechenweg Schritt für Schritt</span><span class="cnt">0 / ${s.steps.length}</span></div>
    <div class="task">${s.title?`<p><b>${s.title}</b></p>`:""}${s.task?(/^\s*</.test(s.task)?s.task:`<p>${s.task}</p>`):""}</div>
    <ol class="st">${s.steps.map((x,i)=>`<li><div class="n">Schritt ${i+1}${x.t?` · ${x.t}`:""}</div>${/^\s*</.test(x.b)?x.b:`<p>${x.b}</p>`}</li>`).join("")}</ol>
    <div class="sf"><button class="btn pri" onclick="stepNext('${id}')">Nächster Schritt</button><button class="btn" onclick="stepAll('${id}')">Alle zeigen</button><button class="btn" onclick="stepReset('${id}')">Zurücksetzen</button></div>
  </div>`;
}
function stepUpd(el){ const i=+el.dataset.i, n=+el.dataset.n; el.querySelectorAll("ol.st li").forEach((li,k)=>li.classList.toggle("show",k<i));
  el.querySelector(".cnt").textContent=`${i} / ${n}`; el.querySelector(".btn.pri").disabled = i>=n; }
function stepNext(id){ const el=document.getElementById(id); el.dataset.i=Math.min(+el.dataset.n,+el.dataset.i+1); stepUpd(el); }
function stepAll(id){ const el=document.getElementById(id); el.dataset.i=el.dataset.n; stepUpd(el); }
function stepReset(id){ const el=document.getElementById(id); el.dataset.i=0; stepUpd(el); }

const QDATA = {};
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function quizBox(list, title){
  return `<div class="quiz"><div class="qh">${title||"Mini-Check"}</div>${list.map(q=>{
    const id="q"+(++QID); QDATA[id]=q; let body="";
    if(q.type==="mc"){ body=`${q.code?`<pre><code class="language-python">${esc(q.code)}</code></pre>`:""}<div class="opts">${shuffle(q.options.map((_,i)=>i)).map(i=>`<button class="opt" onclick="ansMC('${id}',${i},this)">${q.options[i]}</button>`).join("")}</div>`; }
    else if(q.type==="bug"){ body=q.lines.map((l,i)=>`<button class="cl" onclick="ansBug('${id}',${i},this)"><span class="ln">${i+1}</span>${esc(l)}</button>`).join(""); }
    else if(q.type==="order"){ q._pool=shuffle(q.steps.map((_,i)=>i)); q._sel=[]; body=`<div class="ord" id="${id}s" style="margin-bottom:8px"></div><div class="ord" id="${id}p"></div><div style="margin-top:8px;display:flex;gap:8px"><button class="btn" onclick="ordReset('${id}')">Zurücksetzen</button><button class="btn pri" id="${id}c" onclick="ordCheck('${id}')" disabled>Prüfen</button></div>`; setTimeout(()=>ordDraw(id),0); }
    else if(q.type==="gap"){ body=`<div class="gap">${q.prefix?`<span>${q.prefix}</span>`:""}<input id="${id}i" inputmode="decimal" placeholder="Antwort" onkeydown="if(event.key==='Enter')ansGap('${id}')">${q.unit?`<span>${q.unit}</span>`:""}<button class="btn pri" onclick="ansGap('${id}')">Prüfen</button><button class="btn" onclick="showGap('${id}')">Lösung zeigen</button></div>`; }
    return `<div class="q" id="${id}"><div class="qq">${q.q}</div>${body}<div class="fb" id="${id}f"></div></div>`;
  }).join("")}</div>`;
}
function fb(id, ok, extra){ const q=QDATA[id], el=document.getElementById(id+"f");
  el.className="fb show "+(ok?"ok":"bad");
  el.innerHTML = ok ? `<b>Richtig.</b> ${q.explain||""}` : `<b>Noch nicht.</b> ${extra||q.hint||"Überleg nochmal. Die Erklärung erscheint, sobald es stimmt."}`;
  typeset(el); }
function ansMC(id,i,btn){ const q=QDATA[id], ok=i===q.answer; btn.classList.add(ok?"ok":"bad"); if(ok) document.querySelectorAll(`#${id} .opt`).forEach(b=>b.disabled=true); else btn.disabled=true; fb(id,ok); }
function ansBug(id,i,btn){ const q=QDATA[id], ok=i===q.answer; btn.classList.add(ok?"ok":"bad"); if(ok) document.querySelectorAll(`#${id} .cl`).forEach(b=>b.disabled=true); fb(id,ok); }
function ordDraw(id){ const q=QDATA[id], m=q.mono?" mono":"", t=i=>q.mono?esc(q.steps[i]):q.steps[i];
  const s=document.getElementById(id+"s"); if(!s) return;
  s.innerHTML=q._sel.map((i,k)=>`<button class="chip sel${m}" onclick="ordPop('${id}',${k})"><span class="k">${k+1}</span>${t(i)}</button>`).join("");
  document.getElementById(id+"p").innerHTML=q._pool.filter(i=>!q._sel.includes(i)).map(i=>`<button class="chip${m}" onclick="ordPick('${id}',${i})">${t(i)}</button>`).join("");
  document.getElementById(id+"c").disabled = q._sel.length!==q.steps.length; typeset(document.getElementById(id)); }
function ordPick(id,i){ QDATA[id]._sel.push(i); ordDraw(id); }
function ordPop(id,k){ QDATA[id]._sel.splice(k,1); ordDraw(id); }
function ordReset(id){ QDATA[id]._sel=[]; ordDraw(id); document.getElementById(id+"f").className="fb"; }
function ordCheck(id){ const q=QDATA[id]; const ok=q._sel.every((v,i)=>q.steps[v]===q.steps[i]);
  const first=q._sel.findIndex((v,i)=>q.steps[v]!==q.steps[i]);
  fb(id, ok, ok?"":`Die ersten ${first} Schritte stimmen. Ab Schritt ${first+1} passt die Reihenfolge nicht.`);
  if(!ok){ q._sel=q._sel.slice(0,first); setTimeout(()=>ordDraw(id),900); } }
function norm(s){ return String(s).trim().replace(/\s+/g,"").replace(",",".").toLowerCase(); }
function ansGap(id){ const q=QDATA[id], v=norm(document.getElementById(id+"i").value);
  const acc=(Array.isArray(q.answer)?q.answer:[q.answer]); let ok=false;
  for(const a of acc){ if(typeof a==="number"){ const x=parseFloat(v); if(!isNaN(x) && Math.abs(x-a)<=(q.tol!=null?q.tol:Math.abs(a)*0.005+1e-9)) ok=true; } else if(norm(a)===v) ok=true; }
  fb(id, ok); }
function showGap(id){ const q=QDATA[id]; const el=document.getElementById(id+"f"); el.className="fb show ok"; el.innerHTML=`<b>Lösung: ${Array.isArray(q.answer)?q.answer[0]:q.answer}${q.unit?" "+q.unit:""}</b> ${q.explain||""}`; typeset(el); }

function typeset(root){
  const run=()=>{ if(window.renderMathInElement) renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});
    if(window.hljs) root.querySelectorAll("pre code:not(.hljs)").forEach(c=>hljs.highlightElement(c)); };
  if(document.readyState==="complete") run(); else addEventListener("load",run,{once:true});
}

function progressOf(id, c){ c = c || CONTENT[id]; const r = READ[id]||{};
  const s = SUBJ.list.find(x=>x.id===id); const total = c ? c.chapters.length : (s.chapters||0);
  const done = Object.keys(r).length; return total ? Math.min(100, Math.round(done/total*100)) : 0; }
function sidebar(active){
  let h = `<div class="brand" onclick="go('#/')"><img src="icons/icon.svg" alt="">GEO Lernskripte</div>`;
  SUBJ.groups.forEach(g=>{
    h += `<div class="grp">${g.label}</div><nav class="nav">`;
    SUBJ.list.filter(s=>s.group===g.id).forEach(s=>{ const p = progressOf(s.id);
      h += `<a href="#/${s.id}" class="${s.id===active?"on":""}" onclick="toggleMenu(false)"><span class="dot ${s.status==="full"?"full":s.status==="legacy"?"legacy":""}"></span>${s.title}${p?`<span class="pg">${p}%</span>`:""}</a>`; });
    h += `</nav>`;
  });
  h += `<div class="side-foot"><button class="ghost" id="themeBtn" onclick="toggleTheme()"></button><button class="ghost" onclick="go('#/');toggleMenu(false)">Übersicht</button></div>`;
  $("#side").innerHTML = h; setTheme(document.documentElement.dataset.theme);
}

let CUR = { id:null, view:"skript" };
function go(h){ location.hash = h; }
function setView(v){ go(`#/${CUR.id}/${v}`); }
function home(){
  CUR.id = null; sidebar(null); $("#tabs").style.display="none"; $("#prog").style.width="0";
  $("#crumb").innerHTML = "<b>Übersicht</b>"; $("#toc").innerHTML="";
  let h = `<div class="home"><h1>Lernskripte</h1><p style="color:var(--mut);margin:0 0 10px">Vermessung und Geoinformatik · THWS. Pro Fach ein interaktives Lernskript und ein Klausur-Cheatsheet.</p>`;
  SUBJ.groups.forEach(g=>{
    h += `<h3 style="margin-top:28px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em">${g.label}</h3><div class="cards">`;
    SUBJ.list.filter(s=>s.group===g.id).forEach(s=>{ const p = progressOf(s.id);
      const st = s.status==="full" ? `<span class="badge full">Skript + Cheatsheet</span>` : s.status==="legacy" ? `<span class="badge">Vorläufig</span>` : `<span class="badge">In Arbeit</span>`;
      h += `<a class="card" href="#/${s.id}"><div class="ct">${s.title}${st}</div><div class="cm">${s.meta||""}</div><div class="bar"><i style="width:${p}%"></i></div></a>`; });
    h += `</div>`;
  });
  $("#doc").innerHTML = h + `</div>`; scrollTo(0,0);
}
function slugger(){ const used={}; return t=>{ let s=String(t).replace(/<[^>]+>/g,"").replace(/\$[^$]*\$/g,"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50)||"x"; if(used[s]) s+="-"+(++used[s]); else used[s]=1; return s; }; }

async function subject(id, view, anchor){
  const s = SUBJ.list.find(x=>x.id===id); if(!s) return home();
  CUR = { id, view: view==="cheatsheet" ? "cheatsheet" : "skript" };
  sidebar(id);
  const g = SUBJ.groups.find(x=>x.id===s.group);
  $("#crumb").innerHTML = `${g?g.label:""} <span style="color:var(--dim)">/</span> <b>${s.title}</b>`;
  $("#doc").innerHTML = `<p class="empty">Lade …</p>`;
  const c = await loadContent(id);
  if(!c){ $("#tabs").style.display="none"; $("#toc").innerHTML=""; $("#doc").innerHTML = `<h1>${s.title}</h1><p class="lead">Das Skript für dieses Fach ist in Arbeit.</p>`; $("#prog").style.width="0"; return; }
  $("#tabs").style.display = "";
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===CUR.view));
  $("#prog").style.width = progressOf(id,c)+"%";
  QID = 0;
  if(CUR.view==="cheatsheet") renderCheatsheet(s,c); else renderSkript(s,c);
  typeset($("#doc"));
  const el = anchor && document.getElementById(anchor);
  if(el) setTimeout(()=>el.scrollIntoView(),60); else scrollTo(0,0);
  spy();
}
function renderSkript(s,c){
  const slug = slugger(); let toc = [];
  let h = `<h1>${c.title||s.title}</h1><p class="lead">${c.lead||""}</p>`;
  if(c.legacy) h += `<div class="legacy-note">Dieses Fach ist noch nicht auf das neue Skript-Format umgestellt. Unten stehen die bisherigen Inhalte als Kapitel.</div>`;
  c.chapters.forEach((ch,i)=>{
    const cid = "k-"+ch.id; const sub = [];
    const ctx = { slug: t=>{ const x=slug(t); sub.push({id:x,t}); return x; } };
    const body = blocks(ch.blocks, ctx);
    const done = READ[s.id] && READ[s.id][ch.id];
    toc.push({id:cid, t:ch.title, n:i+1, sub});
    h += `<section data-ch="${ch.id}"><h2 id="${cid}"><span class="chnum">Kapitel ${i+1}</span><br>${ch.title}</h2>${ch.intro?`<p>${ch.intro}</p>`:""}${body}
      ${ch.sources?`<ul class="src">${ch.sources.map(x=>`<li>Quelle: ${esc(x)}</li>`).join("")}</ul>`:""}
      <div class="chend ${done?"done":""}" id="end-${ch.id}"><span>${done?"Als gelesen markiert":"Kapitel durchgearbeitet?"}</span><button class="btn" onclick="markRead('${s.id}','${ch.id}')">${done?"✓ Gelesen":"Als gelesen markieren"}</button></div></section>`;
  });
  if(c.sources) h += `<hr><ul class="src"><li><b>Quellen dieses Skripts</b></li>${c.sources.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  $("#doc").innerHTML = h;
  $("#toc").innerHTML = `<div class="t">Inhalt</div>${toc.map(t=>`<a href="#/${s.id}/skript/${t.id}" data-a="${t.id}">${t.n}. ${t.t}</a>${t.sub.slice(0,10).map(x=>`<a class="sub" href="#/${s.id}/skript/${x.id}" data-a="${x.id}">${x.t.replace(/<[^>]+>/g,"")}</a>`).join("")}`).join("")}`;
}
function markRead(sid, chid){
  READ[sid] = READ[sid] || {};
  if(READ[sid][chid]) delete READ[sid][chid]; else READ[sid][chid] = Date.now();
  saveRead();
  const el = document.getElementById("end-"+chid), done = !!READ[sid][chid];
  el.classList.toggle("done", done); el.querySelector("span").textContent = done?"Als gelesen markiert":"Kapitel durchgearbeitet?"; el.querySelector("button").textContent = done?"✓ Gelesen":"Als gelesen markieren";
  $("#prog").style.width = progressOf(sid)+"%"; sidebar(sid);
}
function renderCheatsheet(s,c){
  $("#toc").innerHTML = "";
  if(!c.cheatsheet){ $("#doc").innerHTML = `<h1>${s.title} · Cheatsheet</h1><p class="lead">Das Klausur-Cheatsheet entsteht zusammen mit dem vollständigen Skript.</p>`; return; }
  const cs = c.cheatsheet, slug = slugger();
  $("#doc").innerHTML = `<div class="cs-head"><div><h1>${s.title} · Klausur-Cheatsheet</h1><p class="lead">${cs.lead||""}</p></div><button class="btn no-print" onclick="print()">Drucken / PDF</button></div>
    <div class="cs">${cs.sections.map(sec=>`<div class="sec"><h3>${sec.title}</h3>${blocks(sec.blocks,{slug})}</div>`).join("")}</div>`;
}
function spy(){
  const links=[...document.querySelectorAll("#toc a")]; if(!links.length) return;
  const targets=links.map(a=>document.getElementById(a.dataset.a)).filter(Boolean);
  const on=()=>{ let cur=null; for(const t of targets){ if(t.getBoundingClientRect().top<120) cur=t.id; } links.forEach(a=>a.classList.toggle("on",a.dataset.a===cur)); };
  if(window._spy) removeEventListener("scroll", window._spy); window._spy=on; addEventListener("scroll",on,{passive:true}); on();
}
function route(){
  const p = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(!p.length) return home();
  if(p[0]===CUR.id && (p[1]||"skript")===CUR.view && p[2] && document.getElementById(p[2])){ document.getElementById(p[2]).scrollIntoView({behavior:"smooth"}); return; }
  subject(p[0], p[1], p[2]);
}
addEventListener("hashchange", route);
setTheme(document.documentElement.dataset.theme);
route();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
