<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEO//HUD – Lernstation</title>
<meta name="theme-color" content="#070b16">
<meta name="description" content="Gamifizierte Lernstation für Vermessung und Geoinformatik (THWS)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GEO//HUD">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">

<style>
:root{
  --bg:#070b16; --bg2:#0c1324; --panel:#101a30; --panel2:#15213b; --line:#1f2f50;
  --txt:#e6eefc; --mut:#8ea3c7; --dim:#5b6f94;
  --cyan:#22e1ff; --blue:#3b82f6; --cyan-glow:0 0 18px rgba(34,225,255,.35);
  --gold:#e3b34c; --wine:#8e1f43; --ok:#2ee59d; --bad:#ff4d6d;
  --r:14px; --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --hud:'Orbitron','Inter',sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:16px;line-height:1.55}
body{min-height:100vh;
  background:
   radial-gradient(1200px 600px at 80% -10%, rgba(59,130,246,.14), transparent 60%),
   radial-gradient(900px 500px at -10% 20%, rgba(34,225,255,.08), transparent 60%),
   linear-gradient(transparent 0 0), var(--bg);
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
  background-image:linear-gradient(var(--cyan) 1px,transparent 1px),linear-gradient(90deg,var(--cyan) 1px,transparent 1px);
  background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 70%)}
a{color:var(--cyan)}
button{font-family:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}

/* ---------- HUD header ---------- */
.hud{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(7,11,22,.92),rgba(7,11,22,.72));border-bottom:1px solid var(--line)}
.hud-in{max-width:1100px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;gap:14px;align-items:center}
.brand{font-family:var(--hud);font-weight:900;letter-spacing:.08em;font-size:15px;white-space:nowrap;cursor:pointer}
.brand b{color:var(--cyan);text-shadow:var(--cyan-glow)}
.xpbox{flex:1;min-width:0}
.lvl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-family:var(--hud);letter-spacing:.05em}
.lvl .name{color:var(--txt)}
.lvl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl span+span{flex:none;margin-left:8px}
.bar{height:8px;border-radius:99px;background:#0a1222;border:1px solid var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:var(--cyan-glow);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--hud);font-size:13px;white-space:nowrap}
.ring{--p:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10px;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),#14203a 0);position:relative}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;z-index:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:17px}
.iconbtn:hover{border-color:var(--cyan)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;
  font-family:var(--hud);font-size:12px;letter-spacing:.06em;color:var(--mut)}
.tab.on{color:#00131a;background:var(--cyan);border-color:var(--cyan);box-shadow:var(--cyan-glow)}

h1,h2,h3{font-family:var(--hud);letter-spacing:.04em;line-height:1.25}
h1{font-size:22px;margin:6px 0 4px}
h2{font-size:17px;margin:22px 0 8px;color:var(--cyan)}
h3{font-size:14px;margin:18px 0 6px;color:var(--cyan)}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{position:relative;background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);
  padding:16px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5}
.card:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:var(--cyan-glow)}
.card.empty{cursor:default;opacity:.55}
.card.empty:hover{transform:none;border-color:var(--line);box-shadow:none}
.card.done{border-color:var(--gold)}
.card.done::before{background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:1}
.card .ic{font-family:var(--mono);font-size:22px;color:var(--cyan);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:rgba(34,225,255,.07);border:1px solid rgba(34,225,255,.25);margin-bottom:10px}
.card.done .ic{color:var(--gold);border-color:rgba(227,179,76,.4);background:rgba(227,179,76,.08)}
.card .t{font-weight:700;font-size:15px}
.card .m{font-size:12px;color:var(--mut);margin-top:2px}
.card .bar{margin-top:12px}
.badge{display:inline-block;font-family:var(--hud);font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:99px;
  border:1px solid var(--line);color:var(--mut)}
.badge.gold{color:#1a1000;background:var(--gold);border-color:var(--gold)}
.badge.wine{color:#ffd9e4;background:var(--wine);border-color:var(--wine)}

.list{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.mrow:hover{border-color:var(--cyan)}
.mrow.done{border-color:var(--gold);background:linear-gradient(90deg,rgba(142,31,67,.22),var(--panel))}
.mrow .n{font-family:var(--hud);font-size:18px;color:var(--cyan);width:40px;text-align:center}
.mrow.done .n{color:var(--gold)}
.mrow .grow{flex:1;min-width:0}

.back{background:none;border:none;color:var(--mut);cursor:pointer;font-family:var(--hud);font-size:12px;letter-spacing:.08em;padding:6px 0}
.back:hover{color:var(--cyan)}

/* ---------- mission ---------- */
.steps{display:flex;gap:6px;margin:10px 0 16px}
.steps button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;
  font-family:var(--hud);font-size:11px;letter-spacing:.05em;color:var(--mut)}
.steps button.on{border-color:var(--cyan);color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.steps button.ok{color:var(--gold);border-color:rgba(227,179,76,.5)}
.panel{background:linear-gradient(170deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 22px}
.panel p{margin:8px 0}
.tldr{font-size:17px;line-height:1.65}
.mathblock{overflow-x:auto;padding:10px 12px;margin:10px 0;border-left:3px solid var(--blue);background:rgba(59,130,246,.07);border-radius:0 10px 10px 0}
.note{padding:12px 14px;margin:12px 0;border-radius:10px;border:1px solid rgba(227,179,76,.4);background:rgba(227,179,76,.07)}
.note::before{content:"MERKE // ";font-family:var(--hud);font-size:11px;color:var(--gold);letter-spacing:.08em}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--hud);font-size:11px;letter-spacing:.06em;color:var(--mut)}
.tablewrap{overflow-x:auto}
pre{margin:10px 0;border-radius:10px;border:1px solid var(--line);overflow-x:auto}
pre code.hljs{background:#0a1020;font-family:var(--mono);font-size:13.5px;line-height:1.55}
code{font-family:var(--mono);font-size:.9em;background:rgba(34,225,255,.08);padding:1px 5px;border-radius:5px}
pre code{padding:12px 14px!important;display:block}
ul{padding-left:20px}
details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--bg2)}
details summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--cyan)}
details[open] summary::before{content:"▾ "}
details.trap summary::before{content:"⚠ ";color:var(--bad)}
details > div{padding:0 14px 12px}
.sources{font-size:12px;color:var(--dim);margin-top:18px}
.sources li{margin:2px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--cyan);
  background:linear-gradient(180deg,rgba(34,225,255,.18),rgba(34,225,255,.06));color:var(--txt);font-family:var(--hud);font-size:12px;
  letter-spacing:.08em;cursor:pointer;min-height:46px}
.btn:hover{box-shadow:var(--cyan-glow)}
.btn.ghost{border-color:var(--line);background:var(--bg2)}
.btn.gold{border-color:var(--gold);background:linear-gradient(180deg,rgba(227,179,76,.25),rgba(142,31,67,.25))}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}

/* ---------- checks ---------- */
.check{margin:0 0 6px}
.check .qnum{font-family:var(--hud);font-size:11px;color:var(--mut);letter-spacing:.08em}
.check .q{font-weight:600;margin:6px 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-size:15px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt .katex,.q .katex{font-size:1.25em}
.opt .katex .mfrac,.q .katex .mfrac{font-size:1.15em}
.opt.ok{border-color:var(--ok);background:rgba(46,229,157,.12)}
.opt.bad{border-color:var(--bad);background:rgba(255,77,109,.12);animation:shake .35s}
.opt:disabled{cursor:default}
.codeline{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:14px;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:#0a1020;margin:4px 0;cursor:pointer;white-space:pre-wrap}
.codeline .ln{color:var(--dim);margin-right:12px;user-select:none}
.codeline:hover:not(:disabled){border-color:var(--cyan)}
.codeline.ok{border-color:var(--ok);background:rgba(46,229,157,.12)}
.codeline.bad{border-color:var(--bad);background:rgba(255,77,109,.12);animation:shake .35s}
.order-pool,.order-sel{display:grid;gap:8px}
.order-sel{margin-bottom:12px;min-height:30px}
.chip{text-align:left;padding:11px 13px;border-radius:10px;border:1px dashed var(--line);background:var(--bg2);cursor:pointer;font-size:14px}
.chip.picked{border-style:solid;border-color:var(--blue);background:rgba(59,130,246,.1)}
.chip .k{font-family:var(--hud);color:var(--cyan);margin-right:8px;font-size:12px}
.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
.feedback.show{display:block;animation:pop .3s}
.feedback.ok{border:1px solid var(--ok);background:rgba(46,229,157,.08)}
.feedback.bad{border:1px solid var(--bad);background:rgba(255,77,109,.08)}
.progress-dots{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.progress-dots i{width:22px;height:6px;border-radius:9px;background:var(--line)}
.progress-dots i.ok{background:var(--ok)}
.progress-dots i.bad{background:var(--bad)}
.progress-dots i.cur{background:var(--cyan);box-shadow:var(--cyan-glow)}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(30px);opacity:0;z-index:50;
  background:var(--panel2);border:1px solid var(--cyan);border-radius:12px;padding:12px 18px;font-family:var(--hud);font-size:13px;
  box-shadow:var(--cyan-glow);transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.xpfly{position:fixed;z-index:60;font-family:var(--hud);font-weight:900;color:var(--gold);text-shadow:0 0 12px rgba(227,179,76,.7);
  pointer-events:none;animation:fly 1.1s ease-out forwards}
.modal{position:fixed;inset:0;z-index:40;background:rgba(3,6,14,.75);display:none;align-items:flex-end;justify-content:center;padding:12px}
.modal.show{display:flex}
.sheet{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 18px calc(20px + var(--safe-b))}
.sheet textarea{width:100%;min-height:110px;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .v{font-family:var(--hud);font-size:22px;color:var(--cyan)}
.kpi .l{font-size:11px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
.kpi.gold .v{color:var(--gold)}
.victory{text-align:center;padding:26px 10px}
.victory .big{font-family:var(--hud);font-size:30px;color:var(--gold);text-shadow:0 0 20px rgba(227,179,76,.6);animation:pop .6s}
.empty-state{padding:30px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fly{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{transform:translateY(-90px) scale(1);opacity:0}}
@media (max-width:560px){
  .brand{font-size:13px}
  .hud-in{gap:10px}
  .stat .lbl{display:none}
  h1{font-size:19px}
  .panel{padding:14px 14px 18px}
  .tldr{font-size:16px}
  .kpis{grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi .v{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hud">
  <div class="hud-in">
    <div class="brand" onclick="go('#/')">GEO<b>//</b>HUD</div>
    <div class="xpbox">
      <div class="lvl"><span class="name" id="lvlName">Kadett</span><span id="lvlXP">0 XP</span></div>
      <div class="bar"><i id="lvlBar"></i></div>
    </div>
    <div class="stat" title="Streak (Tage in Folge)">🔥 <span id="streak">0</span><span class="lbl">&nbsp;Tage</span></div>
    <div class="ring" id="goalRing" title="Tagesziel"><span id="goalTxt">0%</span></div>
    <button class="iconbtn" onclick="openSync()" title="Spielstand sichern / laden" aria-label="Spielstand">⇅</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="toast" id="toast"></div>

<div class="modal" id="syncModal" onclick="if(event.target===this)closeSync()">
  <div class="sheet">
    <h2 style="margin-top:0">Spielstand-Sync</h2>
    <p class="sub">Dein Fortschritt liegt lokal auf diesem Gerät. So überträgst du ihn auf ein anderes Gerät: Hier exportieren und dort importieren.</p>
    <div class="row">
      <button class="btn" onclick="exportSave()">⬇ Export (Datei)</button>
      <button class="btn ghost" onclick="copySave()">⧉ Code kopieren</button>
    </div>
    <div class="row">
      <label class="btn ghost" style="cursor:pointer">⬆ Import (Datei)<input type="file" accept="application/json,.json" style="display:none" onchange="importFile(this)"></label>
    </div>
    <textarea id="importText" placeholder="…oder Spielstand-Code hier einfügen"></textarea>
    <div class="row">
      <button class="btn" onclick="importText()">Code importieren</button>
      <button class="btn ghost" onclick="closeSync()">Schließen</button>
    </div>
    <details class="trap"><summary>Spielstand zurücksetzen</summary><div>
      <p class="sub">Löscht XP, Streak und alle erledigten Missionen auf diesem Gerät.</p>
      <button class="btn ghost" onclick="resetSave()">Alles zurücksetzen</button></div></details>
  </div>
</div>

<script src="studyData.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<script>
/* =====================================================================
   Spiel-Logik
   ===================================================================== */
const D = window.STUDY_DATA;
const KEY = "geohud.save.v1";
const XP = { tldr: 10, core: 20, firstTry: 15, retry: 5, complete: 30 };

const blankSave = () => ({ v: 1, xp: 0, days: {}, missions: {}, filter: "sem3", created: new Date().toISOString() });
let S = load();

function load(){
  try { return Object.assign(blankSave(), JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch(e){ return blankSave(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function mstate(id){ return S.missions[id] ||= { tldr:false, core:false, checks:{}, done:false }; }

function addXP(n, ev){
  if(!n) return;
  S.xp += n;
  S.days[today()] = (S.days[today()] || 0) + n;
  save(); hud();
  if(ev){ const el = document.createElement("div"); el.className="xpfly"; el.textContent = "+"+n+" XP";
    const x = ev.clientX || innerWidth/2, y = ev.clientY || innerHeight/2;
    el.style.left = (x-30)+"px"; el.style.top = (y-20)+"px"; document.body.appendChild(el); setTimeout(()=>el.remove(),1200); }
}

function level(xp){
  const L = D.levels; let i = 0; while(i+1 < L.length && xp >= L[i+1].xp) i++;
  const cur = L[i], nxt = L[i+1];
  return { name: cur.name, idx: i, pct: nxt ? (xp-cur.xp)/(nxt.xp-cur.xp)*100 : 100, next: nxt };
}
function streak(){
  let n = 0; const d = new Date();
  if(!S.days[today()]) d.setDate(d.getDate()-1);           // Streak lebt bis Mitternacht weiter
  while(true){ const k = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(S.days[k]) { n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}
let lastLevel = null;
function hud(){
  const l = level(S.xp);
  $("#lvlName").textContent = "LV "+(l.idx+1)+" · "+l.name;
  $("#lvlXP").textContent = S.xp+(l.next && innerWidth > 560 ? " / "+l.next.xp : "")+" XP";
  $("#lvlBar").style.width = l.pct+"%";
  $("#streak").textContent = streak();
  const g = Math.min(100, Math.round((S.days[today()]||0)/D.dailyGoalXP*100));
  $("#goalRing").style.setProperty("--p", g); $("#goalTxt").textContent = g+"%";
  if(lastLevel !== null && l.idx > lastLevel) toast("⬆ Rang-Aufstieg: "+l.name+"!");
  lastLevel = l.idx;
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2200); }
function go(h){ location.hash = h; }
function allModules(){ return D.semesters.flatMap(s => s.modules.map(m => ({...m, sem:s}))); }
function findModule(id){ return allModules().find(m => m.id===id); }
function findMission(id){ for(const m of allModules()) for(const x of m.missions) if(x.id===id) return {mod:m, mis:x}; return null; }
function modProgress(m){ if(!m.missions.length) return 0; return m.missions.filter(x => S.missions[x.id]?.done).length / m.missions.length * 100; }
function enhance(root){
  const run = () => {
    if(window.renderMathInElement) renderMathInElement(root, { delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}], throwOnError:false });
    if(window.hljs) root.querySelectorAll("pre code").forEach(c => { if(!c.dataset.hl){ hljs.highlightElement(c); c.dataset.hl=1; } });
  };
  if(document.readyState === "complete") run(); else addEventListener("load", run, {once:true});
}

/* ---------- Views ---------- */
function viewDash(){
  const totalMis = allModules().reduce((a,m)=>a+m.missions.length,0);
  const doneMis = Object.values(S.missions).filter(x=>x.done).length;
  const sems = D.semesters;
  if(!sems.find(s=>s.id===S.filter)) S.filter = sems[0].id;
  const sem = sems.find(s=>s.id===S.filter);
  let h = `
    <h1>Kommandozentrale</h1>
    <p class="sub">Tagesziel: ${D.dailyGoalXP} XP · heute ${S.days[today()]||0} XP gesammelt</p>
    <div class="kpis">
      <div class="kpi"><div class="v">${S.xp}</div><div class="l">XP gesamt</div></div>
      <div class="kpi gold"><div class="v">${doneMis}/${totalMis}</div><div class="l">Missionen</div></div>
      <div class="kpi"><div class="v">${streak()}🔥</div><div class="l">Streak</div></div>
    </div>
    <div class="tabs">${sems.map(s=>`<button class="tab ${s.id===S.filter?"on":""}" onclick="setFilter('${s.id}')">${esc(s.label)}</button>`).join("")}</div>`;
  if(!sem.modules.length) h += `<div class="empty-state">Noch keine Module in „${esc(sem.label)}“.<br>Neue Fächer kommen über <code>studyData.js</code> dazu.</div>`;
  else h += `<div class="grid">${sem.modules.map(m=>{
      const p = modProgress(m), done = m.missions.length && p===100, empty = !m.missions.length;
      return `<div class="card ${done?"done":""} ${empty?"empty":""}" ${empty?"":`onclick="go('#/m/${m.id}')"`}>
        <div class="ic">${esc(m.icon||"◆")}</div>
        <div class="t">${esc(m.title)}</div>
        <div class="m">${empty ? "Missionen in Vorbereitung" : m.missions.length+" Mission"+(m.missions.length>1?"en":"")+" · "+Math.round(p)+"%"}</div>
        ${(()=>{ const w = m.missions.filter(x=>x.weak && !S.missions[x.id]?.done).length; return w?`<div style="margin-top:8px"><span class="badge wine">⚠ ${w} Schwachstelle${w>1?"n":""} offen</span></div>`:""; })()}
        ${empty?"":`<div class="bar"><i style="width:${p}%;${done?"background:linear-gradient(90deg,var(--wine),var(--gold))":""}"></i></div>`}
      </div>`;}).join("")}</div>`;
  $("#app").innerHTML = h;
}
function setFilter(id){ S.filter = id; save(); viewDash(); }

function viewModule(id){
  const m = findModule(id); if(!m) return go("#/");
  $("#app").innerHTML = `
    <button class="back" onclick="go('#/')">← KOMMANDOZENTRALE</button>
    <h1>${esc(m.title)}</h1>
    <p class="sub">${esc(m.sem.label)}${m.code?" · Modul "+esc(m.code):""}${m.prof?" · "+esc(m.prof):""}</p>
    <div class="list">${m.missions.map((x,i)=>{ const st = S.missions[x.id]||{}; return `
      <div class="mrow ${st.done?"done":""}" onclick="go('#/x/${x.id}')">
        <div class="n">${String(i+1).padStart(2,"0")}</div>
        <div class="grow"><div style="font-weight:700">${esc(x.title)}</div>
          <div class="m" style="font-size:12px;color:var(--mut)">⏱ ${x.minutes} min · ${x.checks.length} Checks</div>
          ${x.weak && !st.done?`<div style="margin-top:6px"><span class="badge wine">⚠ KLAUSUR-SCHWACHSTELLE</span></div>`:""}
          ${x.exam?`<div style="margin-top:6px"><span class="badge" style="color:var(--cyan);border-color:rgba(34,225,255,.4)">🎯 ${esc(x.exam)}</span></div>`:""}</div>
        ${st.done?`<span class="badge gold">CLEAR</span>`:`<span class="badge">START</span>`}
      </div>`;}).join("")}</div>`;
}

let MV = null; // aktuelle Mission (View-State)
function viewMission(id, step){
  const f = findMission(id); if(!f) return go("#/");
  const {mod, mis} = f; const st = mstate(id);
  step = step || "a";
  MV = { mod, mis, step, ci: 0, order: null };
  const allOk = mis.checks.every((_,i)=>st.checks[i]==="ok"||st.checks[i]==="fix");
  $("#app").innerHTML = `
    <button class="back" onclick="go('#/m/${mod.id}')">← ${esc(mod.title.toUpperCase())}</button>
    <h1>${esc(mis.title)}</h1>
    <p class="sub">⏱ ${mis.minutes} min · bis zu ${XP.tldr+XP.core+mis.checks.length*XP.firstTry+XP.complete} XP</p>
    <div class="steps">
      <button class="${step==="a"?"on":""} ${st.tldr?"ok":""}" onclick="viewMission('${id}','a')">A · TL;DR</button>
      <button class="${step==="b"?"on":""} ${st.core?"ok":""}" onclick="viewMission('${id}','b')">B · KERNSKRIPT</button>
      <button class="${step==="c"?"on":""} ${allOk?"ok":""}" onclick="viewMission('${id}','c')">C · SKILL-CHECK</button>
    </div>
    <div class="panel" id="pnl"></div>`;
  const p = $("#pnl");
  if(step==="a"){
    p.innerHTML = `<h3 style="margin-top:0">Worum geht's?</h3><p class="tldr">${mis.tldr}</p>
      <div class="actions"><span></span><button class="btn" onclick="claim('tldr',event);viewMission('${id}','b')">VERSTANDEN → KERNSKRIPT</button></div>`;
  } else if(step==="b"){
    p.innerHTML = renderCore(mis) + `
      ${mis.tips?.length?`<h3>Pro-Tipps</h3>${mis.tips.map(t=>`<details><summary>${t.title}</summary><div>${t.body}</div></details>`).join("")}`:""}
      ${mis.traps?.length?`<h3>Klausurfallen</h3>${mis.traps.map(t=>`<details class="trap"><summary>${t.title}</summary><div>${t.body}</div></details>`).join("")}`:""}
      ${mis.sources?.length?`<ul class="sources">${mis.sources.map(s=>`<li>📎 ${esc(s)}</li>`).join("")}</ul>`:""}
      <div class="actions"><button class="btn ghost" onclick="viewMission('${id}','a')">← TL;DR</button>
      <button class="btn" onclick="claim('core',event);viewMission('${id}','c')">ZUM SKILL-CHECK →</button></div>`;
  } else {
    renderCheck();
  }
  enhance(p);
  scrollTo(0, 0);
}
function claim(part, ev){ const st = mstate(MV.mis.id); if(!st[part]){ st[part]=true; addXP(XP[part], ev); save(); } }

function renderCore(mis){
  return mis.core.map(b=>{
    if(b.h) return `<h2>${b.h}</h2>`;
    if(b.p) return `<p>${b.p}</p>`;
    if(b.math) return `<div class="mathblock">$$${b.math}$$</div>`;
    if(b.note) return `<div class="note">${b.note}</div>`;
    if(b.list) return `<ul>${b.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    if(b.code!==undefined) return `<pre><code class="language-${b.lang||"plaintext"}">${esc(b.code)}</code></pre>`;
    if(b.table) return `<div class="tablewrap"><table><thead><tr>${b.table.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    return "";
  }).join("");
}

/* ---------- Skill-Checks ---------- */
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function dots(){ const st = mstate(MV.mis.id);
  return `<div class="progress-dots">${MV.mis.checks.map((_,i)=>{ const s=st.checks[i];
    return `<i class="${i===MV.ci?"cur":(s==="ok"||s==="fix")?"ok":s==="fail"?"bad":""}"></i>`;}).join("")}</div>`; }

function renderCheck(){
  const p = $("#pnl"), c = MV.mis.checks[MV.ci], n = MV.mis.checks.length;
  if(!c) return renderVictory();
  let body = "";
  if(c.type==="mc"){
    const idx = shuffle(c.options.map((_,i)=>i));
    body = `${c.code?`<pre><code class="language-python">${esc(c.code)}</code></pre>`:""}
      <div class="opts">${idx.map(i=>`<button class="opt" data-i="${i}" onclick="answerMC(this,event)">${c.options[i]}</button>`).join("")}</div>`;
  } else if(c.type==="bug"){
    body = `<div>${c.lines.map((l,i)=>`<button class="codeline" data-i="${i}" onclick="answerBug(this,event)"><span class="ln">${i+1}</span>${esc(l)}</button>`).join("")}</div>`;
  } else if(c.type==="order"){
    MV.order = { pool: shuffle(c.steps.map((_,i)=>i)), sel: [] };
    body = `<div class="sub" style="margin:0 0 8px">Tippe die Schritte in der richtigen Reihenfolge an. Antippen in der oberen Liste macht einen Schritt rückgängig.</div>
      <div class="order-sel" id="osel"></div><div class="order-pool" id="opool"></div>
      <div class="actions"><button class="btn ghost" onclick="orderReset()">↺ Zurücksetzen</button><button class="btn" id="ocheck" onclick="answerOrder(event)" disabled>PRÜFEN</button></div>`;
  }
  p.innerHTML = `${dots()}<div class="check">
      <div class="qnum">CHECK ${MV.ci+1} / ${n} · ${({mc:"MULTIPLE CHOICE",bug:"FINDE DEN BUG",order:"REIHENFOLGE"})[c.type]}</div>
      <div class="q">${c.q}</div>${body}
      <div class="feedback" id="fb"></div>
      <div class="actions" id="nextBar" style="display:none"><span></span><button class="btn" onclick="nextCheck()">${MV.ci+1<n?"NÄCHSTER CHECK →":"MISSION ABSCHLIESSEN ★"}</button></div>
    </div>`;
  if(c.type==="order") drawOrder();
  enhance(p);
}
function result(ok, ev){
  const st = mstate(MV.mis.id), c = MV.mis.checks[MV.ci], prev = st.checks[MV.ci];
  const fb = $("#fb");
  if(ok){
    let gain = 0;
    if(prev===undefined){ st.checks[MV.ci]="ok"; gain = XP.firstTry; }
    else if(prev==="fail"){ st.checks[MV.ci]="fix"; gain = XP.retry; }
    addXP(gain, ev); save();
    fb.className="feedback ok show"; fb.innerHTML = `<b>✓ Treffer!</b>${gain?` +${gain} XP`:""}<br>${c.explain||""}`;
    $("#nextBar").style.display="flex";
    $("#pnl").querySelectorAll(".opt,.codeline,.chip").forEach(b=>b.disabled=true);
  } else {
    if(prev===undefined){ st.checks[MV.ci]="fail"; save(); }
    fb.className="feedback bad show"; fb.innerHTML = `<b>✗ Daneben.</b> Versuch's nochmal, ein Treffer im zweiten Anlauf bringt noch +${XP.retry} XP.`;
  }
  enhance(fb);
  const d = $("#pnl .progress-dots"); if(d) d.outerHTML = dots();
}
function answerMC(b, ev){ const c = MV.mis.checks[MV.ci], ok = +b.dataset.i === c.answer;
  b.classList.add(ok?"ok":"bad"); if(!ok) b.disabled=true; result(ok, ev); }
function answerBug(b, ev){ const c = MV.mis.checks[MV.ci], ok = +b.dataset.i === c.answer;
  b.classList.add(ok?"ok":"bad"); if(!ok) b.disabled=true; result(ok, ev); }
function drawOrder(){
  const c = MV.mis.checks[MV.ci], O = MV.order;
  $("#osel").innerHTML = O.sel.map((i,k)=>`<button class="chip picked" onclick="orderPop(${k})"><span class="k">${k+1}</span>${c.steps[i]}</button>`).join("");
  $("#opool").innerHTML = O.pool.filter(i=>!O.sel.includes(i)).map(i=>`<button class="chip" onclick="orderPick(${i})">${c.steps[i]}</button>`).join("");
  $("#ocheck").disabled = O.sel.length !== c.steps.length;
  enhance($("#pnl"));
}
function orderPick(i){ MV.order.sel.push(i); drawOrder(); }
function orderPop(k){ MV.order.sel.splice(k,1); drawOrder(); }
function orderReset(){ MV.order.sel=[]; drawOrder(); $("#fb").className="feedback"; }
function answerOrder(ev){
  const ok = MV.order.sel.every((v,i)=>v===i);
  document.querySelectorAll("#osel .chip").forEach((el,k)=>el.classList.add(MV.order.sel[k]===k?"ok":"bad"));
  document.querySelectorAll("#osel .chip").forEach((el,k)=>{ el.style.borderColor = MV.order.sel[k]===k ? "var(--ok)" : "var(--bad)"; });
  result(ok, ev);
  if(!ok) setTimeout(()=>{ if(MV && MV.order){ MV.order.sel = MV.order.sel.filter((v,i)=>v===i); drawOrder(); } }, 900);
}
function nextCheck(){ MV.ci++; renderCheck(); scrollTo({top:0}); }
function renderVictory(){
  const st = mstate(MV.mis.id), firstClear = !st.done;
  const allSolved = MV.mis.checks.every((_,i)=>st.checks[i]==="ok"||st.checks[i]==="fix");
  const perfect = MV.mis.checks.every((_,i)=>st.checks[i]==="ok");
  if(allSolved && firstClear){ st.done = true; st.doneAt = new Date().toISOString(); addXP(XP.complete); save(); }
  $("#pnl").innerHTML = `<div class="victory">
      <div class="big">${allSolved ? (perfect ? "FLAWLESS VICTORY" : "MISSION CLEAR") : "FAST GESCHAFFT"}</div>
      <p class="sub" style="margin-top:10px">${allSolved ? (firstClear?`+${XP.complete} XP Abschlussbonus · `:"")+"Missionsdaten gesichert." : "Einige Checks sind noch offen. Starte den Skill-Check neu, um sie zu lösen."}</p>
      <div class="row" style="justify-content:center">
        <button class="btn ghost" onclick="viewMission('${MV.mis.id}','c')">↺ Checks wiederholen</button>
        <button class="btn gold" onclick="go('#/m/${MV.mod.id}')">ZUM MODUL</button>
      </div></div>`;
  if(allSolved) toast(perfect?"★ Perfekt gelöst!":"✓ Mission abgeschlossen");
}

/* ---------- Sync (Export / Import) ---------- */
function openSync(){ $("#syncModal").classList.add("show"); }
function closeSync(){ $("#syncModal").classList.remove("show"); }
function payload(){ return JSON.stringify({ app:"geohud", exported:new Date().toISOString(), save:S }); }
function exportSave(){
  const blob = new Blob([payload()], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "geohud-spielstand-"+today()+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000); toast("Spielstand exportiert");
}
async function copySave(){ try{ await navigator.clipboard.writeText(btoa(unescape(encodeURIComponent(payload())))); toast("Code kopiert"); }
  catch(e){ $("#importText").value = btoa(unescape(encodeURIComponent(payload()))); toast("Code unten markieren & kopieren"); } }
function applyImport(txt){
  try{
    let o; try{ o = JSON.parse(txt); } catch(e){ o = JSON.parse(decodeURIComponent(escape(atob(txt.trim())))); }
    const s = o.save || o; if(typeof s.xp !== "number" || !s.missions) throw 0;
    if(!confirm("Spielstand mit "+s.xp+" XP übernehmen? Der aktuelle Stand auf diesem Gerät wird ersetzt.")) return;
    S = Object.assign(blankSave(), s); save(); hud(); closeSync(); route(); toast("Spielstand geladen ✓");
  }catch(e){ toast("Ungültiger Spielstand"); }
}
function importText(){ applyImport($("#importText").value); }
function importFile(inp){ const f = inp.files[0]; if(!f) return; f.text().then(applyImport); inp.value=""; }
function resetSave(){ if(confirm("Wirklich alles zurücksetzen?")){ S = blankSave(); save(); hud(); closeSync(); go("#/"); route(); } }

/* ---------- Router ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/,"").split("/");
  if(h[0]==="m" && h[1]) viewModule(h[1]);
  else if(h[0]==="x" && h[1]) viewMission(h[1], h[2]);
  else viewDash();
}
addEventListener("hashchange", route);
hud(); route();

/* ---------- PWA ---------- */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
